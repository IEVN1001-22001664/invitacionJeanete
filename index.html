<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camacho & Jeanette · Nuestra Boda</title>
<meta name="description" content="Te invitamos a celebrar nuestra boda · 07 de noviembre de 2026">
<meta property="og:title" content="Camacho & Jeanette · Nuestra Boda">
<meta property="og:description" content="Te invitamos a celebrar nuestra boda · 07 de noviembre de 2026">
<meta property="og:image" content="fotos/hero.jpg">
<meta name="theme-color" content="#1a1214">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="fotos/hero.jpg">

<style>
/* =========================================================
   TOKENS
   ========================================================= */
:root{
  --paper:      #f7f2ea;
  --wax-dark:   #4a0a15;
  --gold:       #c9a45c;
  --gold-light: #ecd9a8;
  --ink:        #3b2a26;
  --night:      #1a1214;

  --script: 'Pinyon Script', cursive;
  --serif:  'Cormorant Garamond', Georgia, serif;
  --caps:   'Cinzel', Georgia, serif;

  --app-w: min(100vw, 480px);
  --seal:  clamp(118px, 34vw, 150px);
}

*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{
  background:var(--night);
  color:var(--ink);
  font-family:var(--serif);
  min-height:100dvh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body.locked{ overflow:hidden; height:100dvh; }

/* Fondo de escritorio: la invitación vive en una columna tipo teléfono */
.backdrop{
  position:fixed; inset:0; z-index:0;
  background:url('fotos/hero.jpg') center/cover;
  filter:blur(28px) brightness(.35) saturate(.8);
  transform:scale(1.15);
}

.app{
  position:relative; z-index:1;
  width:var(--app-w);
  margin:0 auto;
  min-height:100dvh;
  background:var(--night);
  box-shadow:0 0 80px rgba(0,0,0,.6);
  overflow:hidden;
}

/* =========================================================
   SOBRE (pantalla de bienvenida)
   ========================================================= */
.envelope{
  position:fixed; top:0; bottom:0;
  left:50%; width:var(--app-w);
  transform:translateX(-50%);
  z-index:50;
  perspective:1400px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  outline:none;
  overflow:hidden;
  transition:opacity .9s ease, transform 1.1s cubic-bezier(.65,0,.35,1);
}

/* Interior del sobre: papel + la foto apenas visible a través */
.env-inner{
  position:absolute; inset:0;
  background:var(--paper);
}
.env-inner::before{
  content:''; position:absolute; inset:0;
  background:url('fotos/hero.jpg') center 30%/cover;
  filter:grayscale(.4) contrast(.8);
  opacity:.22;
}
.env-inner::after{ /* textura de papel */
  content:''; position:absolute; inset:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  mix-blend-mode:multiply;
}

/* Solapas: el contenedor lleva la sombra, el hijo lleva la forma */
.flap{
  position:absolute; inset:0;
  transform-style:preserve-3d;
  transition:transform 1.25s cubic-bezier(.7,0,.25,1), opacity 1s ease .25s;
  will-change:transform;
}
.flap > i{ position:absolute; inset:0; display:block; }

.flap--bottom{ transform-origin:50% 100%; filter:drop-shadow(0 -2px 3px rgba(80,55,40,.10)); }
.flap--bottom > i{
  clip-path:polygon(0 100%, 50% 49%, 100% 100%);
  background:linear-gradient(0deg, rgba(247,242,234,.92), rgba(236,228,216,.86));
}

.flap--left{ transform-origin:0 50%; filter:drop-shadow(3px 0 5px rgba(80,55,40,.16)); }
.flap--left > i{
  clip-path:polygon(0 0, 54% 50%, 0 100%);
  background:linear-gradient(90deg, rgba(226,217,204,.9), rgba(240,233,223,.86));
}
.flap--right{ transform-origin:100% 50%; filter:drop-shadow(-3px 0 5px rgba(80,55,40,.16)); }
.flap--right > i{
  clip-path:polygon(100% 0, 46% 50%, 100% 100%);
  background:linear-gradient(270deg, rgba(226,217,204,.9), rgba(240,233,223,.86));
}

.flap--top{ transform-origin:50% 0; filter:drop-shadow(0 4px 6px rgba(80,55,40,.2)); }
.flap--top > i{
  clip-path:polygon(0 0, 100% 0, 50% 52%);
  background:linear-gradient(180deg, rgba(250,246,240,.94), rgba(238,230,219,.88));
}
/* filo dorado sutil en el borde de la solapa superior */
.flap--top > b{
  position:absolute; inset:0; display:block;
  clip-path:polygon(0 0, 50% 52%, 100% 0, 100% .6%, 50% 52.8%, 0 .6%);
  background:linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold-light) 50%, var(--gold) 70%, transparent);
  opacity:.6;
}

/* Textos superior/inferior del sobre */
.env-label{
  position:absolute; left:0; right:0; z-index:5;
  text-align:center; pointer-events:none;
  transition:opacity .5s ease;
}
.env-label--top{ top:max(7vh, 46px); }
.env-label--top small{
  display:block;
  font-family:var(--caps); font-size:11px; letter-spacing:.42em;
  color:#9a7f55; text-transform:uppercase; padding-left:.42em;
}
.env-label--top span{
  display:block; margin-top:10px;
  font-family:var(--script); font-size:clamp(30px, 9vw, 40px);
  color:var(--wax-dark); line-height:1;
}
.env-label--bottom{ bottom:max(6vh, 36px); }
.env-label--bottom span{
  font-family:var(--serif); font-style:italic; font-size:16px;
  color:#8a7258; letter-spacing:.04em;
}

/* =========================================================
   SELLO DE LACRE
   ========================================================= */
.seal-wrap{
  position:absolute; left:50%; top:50%;
  width:var(--seal); aspect-ratio:1;
  transform:translate(-50%,-50%);
  z-index:10;
}
.seal-glow{
  position:absolute; inset:-30%;
  border-radius:50%;
  background:radial-gradient(circle, rgba(201,164,92,.35), transparent 65%);
  animation:glow 3s ease-in-out infinite;
  pointer-events:none;
}
.seal{
  position:absolute; inset:0;
  animation:breathe 3s ease-in-out infinite;
  filter:drop-shadow(0 6px 10px rgba(60,8,18,.45)) drop-shadow(0 1px 1px rgba(0,0,0,.3));
}
.seal-half{
  position:absolute; inset:0;
  transition:transform 1s cubic-bezier(.3,.6,.3,1), opacity .9s ease .15s;
}
/* corte en zigzag para que se "rompa" el lacre */
.seal-half--l{ clip-path:polygon(0 0, 52% 0, 47% 28%, 54% 52%, 46% 74%, 51% 100%, 0 100%); }
.seal-half--r{ clip-path:polygon(52% 0, 100% 0, 100% 100%, 51% 100%, 46% 74%, 54% 52%, 47% 28%); }
.seal svg{ width:100%; height:100%; display:block; overflow:visible; }
.seal-mono{ font-family:var(--script); }

.hint{
  position:absolute; left:50%; top:calc(50% + var(--seal) / 2 + 22px);
  transform:translateX(-50%);
  z-index:10; pointer-events:none;
  display:flex; flex-direction:column; align-items:center; gap:8px;
  font-family:var(--caps); font-size:11px; letter-spacing:.35em; text-transform:uppercase;
  color:#7d6448; white-space:nowrap; padding-left:.35em;
  transition:opacity .4s ease;
}
.hint svg{ width:22px; height:22px; animation:tap 1.8s ease-in-out infinite; }

/* Destellos dorados flotando sobre el sobre */
.dust{ position:absolute; inset:0; pointer-events:none; z-index:6; }
.dust i{
  position:absolute; width:3px; height:3px; border-radius:50%;
  background:var(--gold-light);
  box-shadow:0 0 6px 1px rgba(201,164,92,.9);
  opacity:0;
  animation:float var(--d) linear var(--delay) infinite;
}

/* Chispas al romper el sello */
.spark{
  position:absolute; left:50%; top:50%; z-index:12;
  width:5px; height:5px; border-radius:50%;
  background:var(--gold-light);
  box-shadow:0 0 8px 2px rgba(236,217,168,.85);
  pointer-events:none;
  animation:burst .95s cubic-bezier(.2,.7,.3,1) forwards;
}

/* ---------- Secuencia de apertura ---------- */
.envelope.opening .seal{ animation:none; }
.envelope.opening .seal-glow{ animation:flash .7s ease forwards; }
.envelope.opening .hint,
.envelope.opening .env-label{ opacity:0; }

.envelope.cracked .seal-half--l{ transform:translate(-70px, 40px) rotate(-28deg); opacity:0; }
.envelope.cracked .seal-half--r{ transform:translate(70px, 55px) rotate(24deg); opacity:0; }

.envelope.unfold .flap--top   { transform:rotateX(-170deg); opacity:0; }
.envelope.unfold .flap--bottom{ transform:rotateX(170deg);  opacity:0; }
.envelope.unfold .flap--left  { transform:rotateY(165deg);  opacity:0; transition-delay:.08s, .33s; }
.envelope.unfold .flap--right { transform:rotateY(-165deg); opacity:0; transition-delay:.08s, .33s; }

.envelope.gone{ opacity:0; transform:translateX(-50%) scale(1.12); pointer-events:none; }
.envelope.gone .env-inner{ transition:opacity .6s; opacity:0; }

/* =========================================================
   PORTADA (provisional — se diseña en la siguiente sección)
   ========================================================= */
.hero{
  position:relative; height:100dvh; min-height:560px;
  overflow:hidden; color:#fff;
}
.hero-photo{
  position:absolute; inset:0;
  background:url('fotos/hero.jpg') center 25%/cover;
  transform:scale(1.18);
  transition:transform 3.2s cubic-bezier(.2,.6,.2,1);
}
.revealed .hero-photo{ transform:scale(1); }
.hero::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(26,18,20,.15) 0%, transparent 35%, rgba(26,18,20,.55) 70%, rgba(26,18,20,.95) 100%);
}
.hero-content{
  position:absolute; left:0; right:0; bottom:max(9vh,56px); z-index:2;
  text-align:center; padding:0 16px;
}
.hero-content > *{ opacity:0; transform:translateY(18px); transition:opacity 1.2s ease, transform 1.2s ease; }
.revealed .hero-content > *{ opacity:1; transform:none; }
.revealed .hero-content > :nth-child(1){ transition-delay:.6s; }
.revealed .hero-content > :nth-child(2){ transition-delay:.9s; }
.revealed .hero-content > :nth-child(3){ transition-delay:1.2s; }
.hero-content small{
  display:block; font-family:var(--caps); font-size:11px; letter-spacing:.4em; padding-left:.4em;
  color:var(--gold-light);
}
.hero-content h1{
  font-family:var(--script); font-weight:400;
  font-size:clamp(52px, 15vw, 70px); line-height:1.05; margin:10px 0 8px;
  text-shadow:0 2px 20px rgba(0,0,0,.4);
}
.hero-content h1 em{ font-style:normal; color:var(--gold-light); font-size:.7em; }
.hero-content p{
  font-family:var(--caps); font-size:13px; letter-spacing:.3em; padding-left:.3em;
}

#petals{
  position:fixed; top:0; left:50%; transform:translateX(-50%);
  width:var(--app-w); height:100dvh;
  pointer-events:none; z-index:40;
}

/* =========================================================
   KEYFRAMES
   ========================================================= */
@keyframes breathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.035); } }
@keyframes glow{ 0%,100%{ opacity:.55; transform:scale(.92); } 50%{ opacity:1; transform:scale(1.05); } }
@keyframes flash{ 0%{ opacity:1; transform:scale(1); } 40%{ opacity:1; transform:scale(1.6); } 100%{ opacity:0; transform:scale(2.2); } }
@keyframes tap{ 0%,100%{ transform:translateY(0); opacity:.7; } 50%{ transform:translateY(-5px); opacity:1; } }
@keyframes float{
  0%  { transform:translate(0,0) scale(.6); opacity:0; }
  15% { opacity:.9; }
  85% { opacity:.6; }
  100%{ transform:translate(var(--x), -140px) scale(1); opacity:0; }
}
@keyframes burst{
  0%  { transform:translate(-50%,-50%) scale(1); opacity:1; }
  100%{ transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(.2); opacity:0; }
}

@media (prefers-reduced-motion: reduce){
  .seal, .seal-glow, .hint svg, .dust i{ animation:none !important; }
  .flap, .seal-half, .hero-photo{ transition-duration:.01s !important; }
}
</style>
</head>
<body class="locked">

<div class="backdrop" aria-hidden="true"></div>

<!-- ===================== SOBRE ===================== -->
<div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Abrir invitación">
  <div class="env-inner"></div>

  <div class="flap flap--bottom"><i></i></div>
  <div class="flap flap--left"><i></i></div>
  <div class="flap flap--right"><i></i></div>
  <div class="flap flap--top"><i></i><b></b></div>

  <div class="dust" id="dust"></div>

  <div class="env-label env-label--top">
    <small>Nuestra boda</small>
    <span>Camacho &amp; Jeanette</span>
  </div>

  <div class="seal-wrap">
    <div class="seal-glow"></div>
    <div class="seal" id="seal">
      <div class="seal-half seal-half--l"></div>
      <div class="seal-half seal-half--r"></div>
    </div>
  </div>

  <div class="hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M12 10.5V9a1.5 1.5 0 0 1 3 0v2"/><path d="M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.6-2.2L4.6 16a1.6 1.6 0 0 1 2.4-2.1L9 15.5"/>
    </svg>
    Toca para abrir
  </div>

  <div class="env-label env-label--bottom">
    <span>07 · Noviembre · 2026</span>
  </div>
</div>

<!-- ===================== CONTENIDO ===================== -->
<main class="app" id="app">
  <section class="hero">
    <div class="hero-photo"></div>
    <div class="hero-content">
      <small>¡Nos casamos!</small>
      <h1>Camacho <em>&amp;</em> Jeanette</h1>
      <p>07 · 11 · 2026</p>
    </div>
  </section>
</main>

<canvas id="petals" aria-hidden="true"></canvas>

<!-- SVG del sello (se clona en cada mitad) -->
<template id="sealTpl">
  <svg viewBox="-110 -110 220 220" aria-hidden="true">
    <defs>
      <radialGradient id="waxGrad" cx="38%" cy="32%" r="75%">
        <stop offset="0"   stop-color="#b8344a"/>
        <stop offset=".45" stop-color="#8a1a2c"/>
        <stop offset="1"   stop-color="#4a0a15"/>
      </radialGradient>
      <radialGradient id="innerGrad" cx="60%" cy="65%" r="70%">
        <stop offset="0" stop-color="#5a0d1a"/>
        <stop offset="1" stop-color="#8a1a2c"/>
      </radialGradient>
      <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0"  stop-color="#f6e7bf"/>
        <stop offset=".5" stop-color="#d4af6a"/>
        <stop offset="1"  stop-color="#a8823e"/>
      </linearGradient>
    </defs>
    <path class="wax-edge" fill="url(#waxGrad)"/>
    <circle r="72" fill="url(#innerGrad)"/>
    <circle r="72" fill="none" stroke="#3a0710" stroke-opacity=".5" stroke-width="3"/>
    <circle r="70" fill="none" stroke="#c9566a" stroke-opacity=".35" stroke-width="1.2" transform="translate(-1 -1)"/>
    <circle r="62" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="1.5 4" opacity=".75"/>
    <text class="seal-mono" x="0" y="16" text-anchor="middle" font-size="58" fill="url(#goldGrad)">C<tspan font-size="32" dy="-6" dx="3">&amp;</tspan><tspan dy="6" dx="3">J</tspan></text>
    <ellipse cx="-34" cy="-46" rx="22" ry="9" fill="#fff" opacity=".13" transform="rotate(-35 -34 -46)"/>
  </svg>
</template>

<script>
(() => {
  const envelope = document.getElementById('envelope');
  const sealEl   = document.getElementById('seal');

  /* ---- Borde irregular del lacre ---- */
  function waxPath(){
    const pts = [], n = 120, R = 92;
    for (let i = 0; i < n; i++){
      const a = (i / n) * Math.PI * 2;
      const r = R + Math.sin(a * 9) * 5 + Math.sin(a * 23 + 1.3) * 2.2 + Math.sin(a * 4 + .7) * 3;
      pts.push(Math.cos(a) * r, Math.sin(a) * r);
    }
    let d = '';
    for (let i = 0; i < pts.length; i += 2) d += (i ? 'L' : 'M') + pts[i].toFixed(1) + ' ' + pts[i + 1].toFixed(1);
    return d + 'Z';
  }
  const d = waxPath();
  const tpl = document.getElementById('sealTpl');
  sealEl.querySelectorAll('.seal-half').forEach((half, idx) => {
    const svg = tpl.content.firstElementChild.cloneNode(true);
    svg.querySelector('.wax-edge').setAttribute('d', d);
    if (idx === 1) svg.querySelector('defs').remove(); // los gradientes ya existen en la primera copia
    half.appendChild(svg);
  });

  /* ---- Polvo dorado flotante ---- */
  const dust = document.getElementById('dust');
  for (let i = 0; i < 18; i++){
    const s = document.createElement('i');
    s.style.left = (10 + Math.random() * 80) + '%';
    s.style.top  = (30 + Math.random() * 65) + '%';
    s.style.setProperty('--d', (5 + Math.random() * 5) + 's');
    s.style.setProperty('--delay', (Math.random() * 6) + 's');
    s.style.setProperty('--x', (Math.random() * 60 - 30) + 'px');
    dust.appendChild(s);
  }

  /* ---- Apertura ---- */
  let opened = false;
  const wait = ms => new Promise(r => setTimeout(r, ms));

  function sparks(){
    const wrap = document.querySelector('.seal-wrap');
    for (let i = 0; i < 26; i++){
      const s = document.createElement('span');
      s.className = 'spark';
      const a = Math.random() * Math.PI * 2, dist = 70 + Math.random() * 110;
      s.style.setProperty('--tx', Math.cos(a) * dist + 'px');
      s.style.setProperty('--ty', Math.sin(a) * dist + 'px');
      s.style.animationDelay = (Math.random() * .12) + 's';
      wrap.appendChild(s);
      setTimeout(() => s.remove(), 1200);
    }
  }

  async function open(){
    if (opened) return;
    opened = true;
    if (navigator.vibrate) navigator.vibrate(18);

    envelope.classList.add('opening');
    sealEl.animate(
      [{ transform:'scale(1)' }, { transform:'scale(.9)' }, { transform:'scale(1.06)' }],
      { duration:320, easing:'ease-out', fill:'forwards' }
    );
    await wait(300);
    envelope.classList.add('cracked');
    sparks();
    await wait(380);
    envelope.classList.add('unfold');
    await wait(950);
    document.body.classList.add('revealed');
    envelope.classList.add('gone');
    startPetals();
    await wait(1100);
    envelope.remove();
    document.body.classList.remove('locked');
  }

  envelope.addEventListener('click', open);
  envelope.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); }
  });

  /* ---- Lluvia de pétalos ---- */
  function startPetals(){
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cv = document.getElementById('petals');
    const ctx = cv.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let W, H;
    const resize = () => {
      W = cv.clientWidth; H = cv.clientHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize(); addEventListener('resize', resize);

    const colors = ['#8a1a2c', '#a8283d', '#6e1222', '#e8c9c0', '#f3dcd2', '#d9b98a'];
    const make = initial => ({
      x: Math.random() * W,
      y: initial ? -Math.random() * H * .7 + H * .15 * Math.random() : -20,
      size: 7 + Math.random() * 8,
      vy: 1 + Math.random() * 1.4,
      sway: Math.random() * Math.PI * 2,
      swaySpd: .01 + Math.random() * .02,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - .5) * .04,
      flip: Math.random() * Math.PI * 2,
      color: colors[Math.random() * colors.length | 0]
    });
    let petals = Array.from({ length: 34 }, () => make(true));
    const start = performance.now();

    function draw(p){
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.scale(1, Math.abs(Math.cos(p.flip)) * .7 + .3);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = .9;
      ctx.beginPath();
      ctx.moveTo(0, -p.size);
      ctx.bezierCurveTo(p.size * .9, -p.size * .6, p.size * .7, p.size * .7, 0, p.size);
      ctx.bezierCurveTo(-p.size * .7, p.size * .7, -p.size * .9, -p.size * .6, 0, -p.size);
      ctx.fill();
      ctx.globalAlpha = .18;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.ellipse(-p.size * .2, -p.size * .3, p.size * .2, p.size * .45, -.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    (function loop(now){
      ctx.clearRect(0, 0, W, H);
      const intense = now - start < 9000; // lluvia intensa al abrir, luego se calma
      petals.forEach(p => {
        p.sway += p.swaySpd; p.flip += .03; p.rot += p.vr;
        p.y += p.vy; p.x += Math.sin(p.sway) * .8;
        draw(p);
      });
      petals = petals.filter(p => p.y < H + 30);
      if (intense && petals.length < 34) petals.push(make(false));
      else if (!intense && petals.length < 10 && Math.random() < .02) petals.push(make(false));
      requestAnimationFrame(loop);
    })(start);
  }
